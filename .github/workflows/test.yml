name: Integration Tests

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: boxing_test
          POSTGRES_PASSWORD: boxing_test_pass
          POSTGRES_DB: boxing_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
        cache: true  # Enable Go module caching

    - name: Install dependencies
      run: |
        go mod download

    - name: Run integration tests with coverage
      env:
        BOXING_ENV: test
        BOXING_DATABASE_HOST: localhost
        BOXING_DATABASE_PORT: 5432
        BOXING_DATABASE_USER: boxing_test
        BOXING_DATABASE_PASSWORD: boxing_test_pass
        BOXING_DATABASE_NAME: boxing_test
        BOXING_REDIS_ADDR: localhost:6379
        BOXING_JWT_SECRET: test-secret-key-change-in-production
      run: |
        # Run integration/functional tests only (with integration build tag)
        go run gotest.tools/gotestsum@latest --format short-verbose \
          --jsonfile test-results.json \
          -tags=integration ./internal/integration/...

        # Generate coverage report for integration tests
        go test -coverprofile=integration-coverage.out -tags=integration ./internal/integration/... || true
        go tool cover -func=integration-coverage.out

    - name: Upload integration coverage
      uses: codecov/codecov-action@v4
      with:
        files: ./integration-coverage.out
        fail_ci_if_error: false
        flags: backend,integration

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: integration-test-results
        path: |
          test-results.json
          integration-coverage.out