name: Integration Tests

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: boxing_test
          POSTGRES_PASSWORD: boxing_test_pass
          POSTGRES_DB: boxing_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25'

    - name: Install dependencies
      run: |
        go mod download

    - name: Run integration tests
      env:
        BOXING_ENV: test
        BOXING_DATABASE_HOST: localhost
        BOXING_DATABASE_PORT: 5432
        BOXING_DATABASE_USER: boxing_test
        BOXING_DATABASE_PASSWORD: boxing_test_pass
        BOXING_DATABASE_NAME: boxing_test
        BOXING_REDIS_ADDR: localhost:6379
        BOXING_JWT_SECRET: test-secret-key-change-in-production
      run: |
        # Run integration/functional tests only
        go run gotest.tools/gotestsum@latest --format short-verbose --jsonfile test-results.json ./internal/integration/...

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: integration-test-results
        path: test-results.json