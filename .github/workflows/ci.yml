# .github/workflows/ci.yml
name: CI Pipeline

on:
  push:
    branches: [ main, develop/* ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install dependencies
        run: |
          go mod download
          # Set git config to avoid authentication issues in CI
          git config --global url."https://github.com/".insteadOf "https://github.com/"
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Run linters
        continue-on-error: true
        run: |
          go vet ./...
          golangci-lint version
          golangci-lint run ./...

      - name: Build application
        run: |
          go build -o boxing-server ./cmd/server

      - name: Run unit tests (fast, no database required)
        run: |
          # Unit tests only - exclude integration package
          go run gotest.tools/gotestsum@latest --format=short-verbose $(go list ./... | grep -v 'internal/integration$')

      - name: Run integration tests with isolated databases
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: 5432
          TEST_DB_USER: postgres
          TEST_DB_PASSWORD: postgres
        run: |
          # Integration tests with ephemeral PostgreSQL - each test gets isolated database via FreshDatabase() helper
          go run gotest.tools/gotestsum@latest --format=short-verbose ./internal/integration/...

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()  # Always upload even on failure for debugging
        with:
          name: boxing-server
          path: boxing-server
