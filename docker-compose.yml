
services:
  postgres:
    image: postgres:16-alpine
    container_name: boxing-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: boxing123
      POSTGRES_DB: boxing
      # This flag bypasses stricter host-based restrictions for development
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Add an init script to ensure proper database user setup
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    networks:
      - boxing-network

  redis:
    image: redis:7-alpine
    container_name: boxing-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - boxing-network



volumes:
  postgres_data:
  redis_data:

networks:
  boxing-network:
    driver: bridge