# Production environment configuration
# Non-secret default values for production deployments
# All secrets MUST be set via environment variables (BOXING_* prefix)

server:
  port: 8080
  host: "0.0.0.0"
  logLevel: "info"

database:
  host: "localhost"
  port: 5432
  user: "boxing"
  name: "boxing_prod"
  # password MUST be set via BOXING_DATABASE_PASSWORD env var

redis:
  addr: "localhost:6379"
  # password comes from BOXING_REDIS_PASSWORD env var (if needed)

jwt:
  # secret MUST be set via BOXING_JWT_SECRET env var

logging:
  level: "info"

worker:
  poll_interval_ms: 1000      # Poll every 1 second in production
  startup_jitter_max_ms: 10000 # Max 10 second jitter on startup to prevent thundering herd
  game_speed_factor: 60.0     # 1 real minute = 1 game hour (60x speed)

fight:
  min_schedule_hours: 24      # Fights must be scheduled at least 24 hours from current game time
