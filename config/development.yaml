# Development environment configuration
# Non-secret default values for local development
# Secrets should be set via environment variables (BOXING_* prefix)

server:
  port: 8080
  host: "127.0.0.1"
  logLevel: "debug"

database:
  host: "127.0.0.1"
  port: 5433
  user: "boxing"
  name: "boxing"
  # password must be set via BOXING_DATABASE_PASSWORD env var

redis:
  addr: "127.0.0.1:6379"
  # password comes from BOXING_REDIS_PASSWORD env var (if needed)

jwt:
  # secret must be set via BOXING_JWT_SECRET env var

logging:
  level: "debug"

worker:
  poll_interval_ms: 500       # Poll every 500ms for events
  startup_jitter_max_ms: 5000 # Max 5 second jitter on startup
  game_speed_factor: 60.0     # 1 real second = 10 game minutes (for fast testing)

fight:
  min_schedule_hours: 24      # Fights must be scheduled at least 24 hours from current game time

events:
  cleanup:
    abandon_age_hours: 168    # Clean up failed events older than 1 week (MAT-143)
    run_interval_minutes: 60  # Run cleanup job every hour
