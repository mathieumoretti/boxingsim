# Test environment configuration
# Non-secret default values for testing
# Integration tests use TEST_* env vars for database isolation

server:
  port: 8081
  host: "localhost"
  logLevel: "warn"

database:
  host: "localhost"
  port: 5432
  user: "boxing"
  name: "boxing_test"
  # password comes from BOXING_DATABASE_PASSWORD env var
  # Integration tests override with TEST_* env vars

redis:
  addr: "localhost:6380"
  # Separate Redis instance for tests to avoid polluting dev Redis
  # password comes from BOXING_REDIS_PASSWORD env var (if needed)

jwt:
  secret: "test-jwt-secret-do-not-use-in-production"

logging:
  level: "warn"

worker:
  poll_interval_ms: 250       # Faster polling for tests
  startup_jitter_max_ms: 100  # Minimal jitter in tests
  game_speed_factor: 600.0    # Very fast for quick test execution (1 sec = 10 game minutes)

fight:
  min_schedule_hours: 1       # Shorter minimum for faster testing

events:
  cleanup:
    abandon_age_hours: 24     # Faster cleanup for tests (1 day)
    run_interval_minutes: 5   # Run cleanup more frequently in tests

  retry:
    max_retries:        3     # Maximum retry attempts for failed events
    base_delay_seconds: 5     # Shorter delay for faster test execution
    max_delay_seconds:  60    # Lower max delay cap for tests (1 minute)
