# Test environment configuration
# Non-secret default values for testing
# Integration tests use TEST_* env vars for database isolation

server:
  port: 8081
  host: "localhost"
  logLevel: "warn"

database:
  host: "localhost"
  port: 5432
  user: "boxing"
  password: "boxing123"
  name: "boxing"
  # These defaults match applyDefaults() in config.go
  # Tests override with BOXING_DATABASE_* or TEST_DB_* env vars

redis:
  addr: "localhost:6380"
  # Separate Redis instance for tests to avoid polluting dev Redis
  # password comes from BOXING_REDIS_PASSWORD env var (if needed)

jwt:
  secret: "test-jwt-secret-do-not-use-in-production"

logging:
  level: "warn"

worker:
  poll_interval_ms: 250       # Faster polling for tests
  startup_jitter_max_ms: 100  # Minimal jitter in tests
  game_speed_factor: 600.0    # Very fast for quick test execution (1 sec = 10 game minutes)

fight:
  min_schedule_hours: 1       # Shorter minimum for faster testing
